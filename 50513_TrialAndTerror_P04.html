<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FaultLine — Dependency Supply Chain Risk</title>
<meta name="description" content="FaultLine maps your dependency tree, simulates compromise propagation on a live digital twin, and ranks the fixes that cut the most risk." />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M9.5,4.7 L16,4.8 L13,10 L18,14 L12,18 L17,23 L16,27.2 L9.5,27.3 L3,16 Z' fill='%231E6E6B'/%3E%3Cpath d='M9.5,4.7 L22.5,4.7 L29,16 L22.5,27.3 L9.5,27.3 L3,16 Z' fill='none' stroke='%2322201B' stroke-width='1.4' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#F3F0E9;
    --bg-alt:#EBE7DD;
    --surface:#FDFCFA;
    --surface-2:#F7F4EE;
    --line:#E1DACB;
    --ink:#22201B;
    --ink-2:#4A453C;
    --muted:#8A8172;
    --accent:#1E6E6B;
    --accent-ink:#0E3D3B;
    --accent-soft:#DCEEEC;
    --sidebar-bg:#1C1A16;
    --sidebar-ink:#EDE9DE;
    --sidebar-muted:#9A9385;
    --sidebar-active:#2A2721;
    --crit:#B23A2E;
    --crit-soft:#F6DEDA;
    --high:#C97A25;
    --high-soft:#F5E4CC;
    --med:#B99327;
    --med-soft:#F3ECCC;
    --low:#4C7A4E;
    --low-soft:#DEEBDD;
    --cf:#3B6FA8;
    --cf-soft:#DEE8F2;
    --shadow: 0 1px 2px rgba(30,26,18,.07);
    --shadow-lift: 0 1px 2px rgba(30,26,18,.06), 0 8px 24px -12px rgba(30,26,18,.22);
    --radius: 14px;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    --display: 'Montserrat', 'Arial Black', sans-serif;
    --body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17120E;
      --bg-alt:#1D1712;
      --surface:#221C16;
      --surface-2:#291F18;
      --line:#3A2E23;
      --ink:#F1EADC;
      --ink-2:#C9BDA9;
      --muted:#8F8271;
      --accent:#4FBDB6;
      --accent-ink:#BEEFEA;
      --accent-soft:#1F3D3A;
      --sidebar-bg:#0F0C09;
      --sidebar-ink:#F1EADC;
      --sidebar-muted:#8F8271;
      --sidebar-active:#221C16;
      --crit:#E2685A;
      --crit-soft:#3B211D;
      --high:#E2A15A;
      --high-soft:#3B2E1D;
      --med:#D9C168;
      --med-soft:#39331D;
      --low:#7FB482;
      --low-soft:#20301F;
      --cf:#8FB3DE;
      --cf-soft:#22344A;
      --shadow: 0 1px 2px rgba(0,0,0,.35);
    --shadow-lift: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#17120E;
    --bg-alt:#1D1712;
    --surface:#221C16;
    --surface-2:#291F18;
    --line:#3A2E23;
    --ink:#F1EADC;
    --ink-2:#C9BDA9;
    --muted:#8F8271;
    --accent:#4FBDB6;
    --accent-ink:#BEEFEA;
    --accent-soft:#1F3D3A;
    --sidebar-bg:#0F0C09;
    --sidebar-ink:#F1EADC;
    --sidebar-muted:#8F8271;
    --sidebar-active:#221C16;
    --crit:#E2685A;
    --crit-soft:#3B211D;
    --high:#E2A15A;
    --high-soft:#3B2E1D;
    --med:#D9C168;
    --med-soft:#39331D;
    --low:#7FB482;
    --low-soft:#20301F;
    --cf:#8FB3DE;
    --cf-soft:#22344A;
    --shadow: 0 1px 2px rgba(0,0,0,.35);
    --shadow-lift: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--body); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:var(--display); font-weight:600; text-wrap:balance; margin:0;}
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  a{color:inherit;}
  button{font-family:var(--body);}

  .app{display:grid; grid-template-columns:76px 1fr; min-height:100vh; transition:grid-template-columns .18s ease;}
  .app:has(.sidebar:hover),.app:has(.sidebar:focus-within){grid-template-columns:232px 1fr;}
  @media (max-width: 860px){ .app, .app:has(.sidebar:hover){grid-template-columns:1fr;} .sidebar{display:none;} }

  .sidebar{background:var(--sidebar-bg); color:var(--sidebar-ink); padding:20px 14px; display:flex; flex-direction:column; gap:22px; overflow:hidden; white-space:nowrap; position:relative; z-index:20;}
  .brand{display:flex; align-items:center; gap:10px; padding:2px 8px;}
  .brand svg{flex:none;}
  .brand-text{font-family:var(--display); font-weight:700; font-size:18px; letter-spacing:-.2px; opacity:1; transition:opacity .12s;}
  .nav{display:flex; flex-direction:column; gap:2px; margin-top:6px;}
  .nav-item{display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:9px; color:var(--sidebar-muted); cursor:pointer; font-size:13.5px; font-weight:500; border:none; background:none; text-align:left; width:100%;}
  .nav-item svg{flex:none; opacity:.85;}
  .nav-item:hover{background:var(--sidebar-active); color:var(--sidebar-ink);}
  .nav-item.active{background:var(--accent); color:#0B211F; font-weight:600;}
  .nav-item.active svg{opacity:1;}
  .nav-label{opacity:1; transition:opacity .1s; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; display:block;}
  .app:not(:has(.sidebar:hover)):not(:has(.sidebar:focus-within)) .nav-label,
  .app:not(:has(.sidebar:hover)):not(:has(.sidebar:focus-within)) .brand-text{opacity:0;}

  .main{display:flex; flex-direction:column; min-width:0;}
  .topbar{position:relative; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 26px; border-bottom:1px solid var(--line); background:var(--surface);}
  .topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none;
    background:linear-gradient(90deg, transparent 0 6%, var(--accent) 6% 9%, transparent 9% 33%, var(--accent) 33% 37%, transparent 37% 61%, var(--accent) 61% 65%, transparent 65% 84%, var(--accent) 84% 88%, transparent 88% 100%);
    opacity:.45;}
  .topbar-left h1{font-size:19px;}
  .topbar-left .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .topbar-right{display:flex; align-items:center; gap:12px;}
  .search{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:8px 12px; color:var(--muted); font-size:13px; width:220px; transition:border-color .15s, box-shadow .15s;}
  .search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .search input{border:none; background:none; outline:none; color:var(--ink); font-size:13px; width:100%; font-family:var(--body);}
  .btn{display:inline-flex; align-items:center; gap:7px; border-radius:9px; padding:9px 16px; font-size:13px; font-weight:600; border:1px solid transparent; cursor:pointer; transition:filter .15s, background .15s, transform .1s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent); color:#08201E;}
  .btn-primary:hover{filter:brightness(1.06);}
  .btn-ghost{background:var(--surface-2); border-color:var(--line); color:var(--ink-2);}
  .btn-ghost:hover{background:var(--bg-alt);}
  .btn-ghost.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}
  .avatar{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#08201E; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--line); flex:none;}
  .icon-btn{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); border:1px solid var(--line); color:var(--ink-2); cursor:pointer; transition:border-color .15s, color .15s, background .15s;}
  .icon-btn:hover{border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft);}

  .content{padding:22px 26px 40px; overflow:auto;}
  .tab-bar{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:20px;}
  .tab{padding:9px 4px; margin-right:20px; font-size:13.5px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer;}
  .tab.active{color:var(--ink); border-color:var(--accent);}

  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
  .grid2{display:grid; grid-template-columns:1.6fr 1fr; gap:16px; margin-bottom:16px; align-items:start;}
  .grid2b{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; align-items:start;}
  @media (max-width:980px){ .grid4{grid-template-columns:repeat(2,1fr);} .grid2,.grid2b{grid-template-columns:1fr;} }

  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
  .stat{display:flex; flex-direction:column; gap:8px; cursor:pointer; transition:border-color .15s, transform .12s, box-shadow .15s;}
  .stat:hover{border-color:var(--accent); box-shadow:var(--shadow-lift); transform:translateY(-2px);}
  .stat:active{transform:translateY(-1px) scale(.99);}
  .stat-top{display:flex; align-items:center; gap:7px; color:var(--muted); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em;}
  .stat-val{font-family:var(--mono); font-size:28px; font-weight:600; display:flex; align-items:baseline; gap:8px;}
  .stat-val .of{font-size:14px; color:var(--muted); font-weight:500;}
  .stat-sub{font-size:12px; color:var(--muted);}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px; letter-spacing:.01em;}
  .pill-crit{background:var(--crit-soft); color:var(--crit);}
  .pill-high{background:var(--high-soft); color:var(--high);}
  .pill-med{background:var(--med-soft); color:var(--med);}
  .pill-low{background:var(--low-soft); color:var(--low);}
  .pill-accent{background:var(--accent-soft); color:var(--accent-ink);}

  .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; gap:10px; flex-wrap:wrap;}
  .card-head h3{font-size:15px;}
  .meta-small{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .link{font-size:12px; font-weight:600; color:var(--accent-ink); cursor:pointer; white-space:nowrap;}
  .link:hover{text-decoration:underline;}

  .graph-card{padding:0; overflow:hidden;}
  .graph-toolbar{display:flex; align-items:center; justify-content:space-between; padding:16px 18px 10px;}
  .graph-wrap{position:relative; height:420px; border-top:1px solid var(--line);}
  .graph-wrap svg{width:100%; height:100%; display:block; cursor:grab;}
  .legend{position:absolute; left:14px; top:14px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:11.5px; box-shadow:var(--shadow-lift); z-index:3;}
  .legend-row{display:flex; align-items:center; gap:7px; padding:3px 4px; color:var(--ink-2); cursor:pointer; border-radius:6px; user-select:none;}
  .legend-row:hover{background:var(--surface-2);}
  .legend-row.off{color:var(--muted); opacity:.5;}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .zoom-ctl{position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:5px; z-index:3;}
  .zoom-btn{width:30px; height:30px; border-radius:8px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-lift); color:var(--ink-2); display:flex; align-items:center; justify-content:center; cursor:pointer; font-family:var(--mono); font-size:15px;}
  .zoom-btn:hover{border-color:var(--accent); color:var(--accent-ink);}

  .node-crit{filter:drop-shadow(0 0 0 rgba(178,58,46,0));}
  @keyframes pulse-ring{0%{stroke-opacity:.55; stroke-width:2px;} 100%{stroke-opacity:0; stroke-width:14px;}}
  .pulse{animation:pulse-ring 1.8s ease-out infinite;}
  @media (prefers-reduced-motion: reduce){ .pulse{animation:none; stroke-opacity:.35;} }

  .detail-panel{display:flex; flex-direction:column; gap:14px;}
  .crit-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .crit-name{display:flex; align-items:center; gap:10px;}
  .crit-icon{width:38px; height:38px; border-radius:10px; background:var(--crit-soft); color:var(--crit); display:flex; align-items:center; justify-content:center; flex:none;}
  .crit-name h3{font-size:16px;}
  .crit-name .v{font-size:12px; color:var(--muted); font-family:var(--mono);}
  .cve-line{font-size:12px; color:var(--ink-2); background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; line-height:1.5;}
  .cve-line b{color:var(--ink);}
  .score-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; font-size:12px; color:var(--ink-2); font-weight:600;}
  .score-bar-track{height:9px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden;}
  .score-bar-fill{height:100%; border-radius:99px;}
  .factor-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:12px;}
  .factor{background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:8px 6px; text-align:center;}
  .factor .fv{font-family:var(--mono); font-weight:700; font-size:15px;}
  .factor .fl{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}

  .action-row{display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line);}
  .action-row:first-of-type{border-top:none; padding-top:2px;}
  .action-check{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; color:var(--surface);}
  .action-check.done{background:var(--low); border-color:var(--low);}
  .action-body{flex:1; min-width:0;}
  .action-title{font-size:13px; font-weight:600;}
  .action-meta{font-size:11.5px; color:var(--muted); margin-top:1px;}
  /* Highlights the top-ranked action in a ranked action-row list (the
     Firebreak Optimizer) without breaking the shared row/divider pattern
     used everywhere else -- the tint bleeds to the card's own edges instead
     of sitting as a separate boxed-in row. */
  .action-row-rec{background:var(--accent-soft); border-radius:9px; margin:0 -18px; padding:10px 18px; border-top-color:transparent;}
  .action-row-rec + .action-row{border-top-color:transparent;}
  .fb-delta{display:flex; flex-direction:column; align-items:flex-end; gap:3px; flex:none;}
  .fb-delta-num{font-family:var(--mono); font-weight:700; font-size:12.5px; color:var(--low); white-space:nowrap;}

  .health-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); font-size:12.5px;}
  .health-row:first-of-type{border-top:none;}
  .health-label{display:flex; align-items:center; gap:8px; color:var(--ink-2);}
  .health-dot{width:7px; height:7px; border-radius:50%;}

  .subtab-row{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .subtab{padding:8px 14px; border-radius:8px; font-size:12.5px; font-weight:600; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer; transition:border-color .15s, color .15s;}
  .subtab:hover:not(.active){border-color:var(--accent); color:var(--ink);}
  .subtab.active{background:var(--ink); color:var(--surface); border-color:var(--ink);}

  .metric-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0;}
  .metric-box{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px;}
  .metric-box .mv{font-family:var(--mono); font-size:20px; font-weight:700;}
  .metric-box .ml{font-size:11px; color:var(--muted); margin-top:2px;}

  /* Segmented scenario picker -- exactly one of the four "what if" types is
     ever selected, so this reads as one control (like a tab strip) instead
     of a stack of independent rows each carrying its own pre-computed number. */
  .cf-seg{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .cf-seg-btn{display:flex; align-items:center; gap:7px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); font-size:12.5px; font-weight:600; cursor:pointer; transition:border-color .15s, background .15s, color .15s;}
  .cf-seg-btn:hover{border-color:var(--cf); color:var(--ink);}
  .cf-seg-btn.active{border-color:var(--cf); background:var(--cf-soft); color:var(--ink);}
  .cf-seg-btn svg{flex:none; opacity:.85;}
  .cf-icon{width:26px; height:26px; border-radius:7px; background:var(--accent-soft); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; flex:none;}
  .cf-detail{border:1px solid var(--cf); background:var(--surface); border-radius:10px; padding:14px 16px;}
  .cf-detail-head{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .cf-icon-lg{width:32px; height:32px; border-radius:8px; background:var(--cf); color:#fff;}
  .cf-detail-title{flex:1; min-width:0; display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:13.5px; font-weight:700;}
  .cf-detail-title select{padding:5px 9px; border-radius:7px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:12.5px; font-weight:600; font-family:var(--body); max-width:100%;}
  .cf-badge{display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--cf); flex:none; white-space:nowrap;}
  .cf-badge svg{color:var(--cf);}
  .cf-desc{font-size:12.5px; color:var(--ink-2); line-height:1.55; margin-bottom:12px;}

  .live-card{margin-bottom:16px; display:flex; flex-direction:column; gap:0;}
  .live-row{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;}
  .live-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .live-dot{width:10px; height:10px; border-radius:50%; flex:none; position:relative;}
  .live-dot::after{content:''; position:absolute; inset:-4px; border-radius:50%; border:1.5px solid currentColor; opacity:0;}
  .live-dot-idle{background:var(--muted); color:var(--muted);}
  .live-dot-checking{background:var(--accent); color:var(--accent);}
  .live-dot-checking::after{opacity:.6; animation:live-ping 1.4s ease-out infinite;}
  .live-dot-ok{background:var(--low); color:var(--low);}
  .live-dot-ok::after{opacity:.5; animation:live-ping 2.6s ease-out infinite;}
  .live-dot-alert{background:var(--crit); color:var(--crit);}
  .live-dot-alert::after{opacity:.6; animation:live-ping 1.4s ease-out infinite;}
  .live-dot-error{background:var(--high); color:var(--high);}
  @keyframes live-ping{0%{transform:scale(.6); opacity:.6;} 100%{transform:scale(1.8); opacity:0;}}
  @media (prefers-reduced-motion: reduce){ .live-dot::after{animation:none !important; opacity:.35 !important;} }
  .live-title{font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .live-status-text{font-size:12px; color:var(--muted); display:block; margin-top:2px;}
  .live-status-text.live-status-ok{color:var(--low);}
  .live-status-text.live-status-alert{color:var(--crit); font-weight:600;}
  .live-status-text.live-status-error{color:var(--high);}
  .live-time{font-size:10.5px; color:var(--muted); margin-top:2px; font-family:var(--mono);}
  .live-findings{margin-top:14px; padding-top:12px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:8px;}
  .live-finding-row{display:flex; align-items:flex-start; gap:12px; background:var(--crit-soft); border:1px solid var(--crit); border-radius:9px; padding:9px 12px;}
  .live-finding-pkg{font-family:var(--mono); font-size:12px; font-weight:700; color:var(--crit); flex:none; min-width:110px;}
  .live-finding-body{flex:1; min-width:0;}
  .live-finding-id{font-size:12px; font-weight:600;}
  .live-finding-id a{color:var(--accent-ink);}
  .live-finding-summary{font-size:11.5px; color:var(--ink-2); margin-top:2px; line-height:1.45;}
  .live-rec{margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:11.5px; color:var(--ink-2);}
  .live-rec b{color:var(--ink); font-weight:700;}
  .live-rec-meta{color:var(--muted); margin-top:2px;}

  tbody tr[data-seed]:hover{background:var(--surface-2);}

  input[type=range]{flex:1; -webkit-appearance:none; height:5px; border-radius:99px; background:var(--line); outline:none;}

  input[type=range]::-moz-range-thumb{width:11px; height:11px; border-radius:50%; background:var(--accent); border:3px solid var(--surface); box-shadow:0 0 0 1px var(--accent); cursor:pointer;}
  .slider-val{font-family:var(--mono); font-weight:700; font-size:15px; min-width:44px; text-align:right;}
  .rank{width:22px; height:22px; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); font-family:var(--mono); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center;}

(function calibrate(){
  const base = cloneAdj();
  const raw = rawAggregate(base, {});
  CALIBRATION = raw ? DATA.total_risk_score / raw : 1;
})();
function totalRisk(adj, overrides){
  return Math.max(0, Math.min(100, rawAggregate(adj, overrides) * CALIBRATION));
}

/* ---------- blast radius (BFS over REV = who depends on the seed) ---------- */
function blastRadius(seeds, adj){
  adj = adj || {FWD, REV};
  const levels = {}; const q = [];
  seeds.forEach(s => { levels[s] = 0; q.push(s); });
  let i = 0;
  while(i < q.length){
    const cur = q[i++]; const lvl = levels[cur];
    (adj.REV[cur]||[]).forEach(p => { if(!(p in levels)){ levels[p] = lvl+1; q.push(p); } });
  }
  const affected = Object.keys(levels).filter(n => !seeds.includes(n));
  const appsAffected = affected.filter(isRoot);
  const pkgsAffected = affected.filter(n => !isRoot(n));
  const maxDepth = Math.max(0, ...Object.values(levels));
  return { levels, affected, appsAffected, pkgsAffected, maxDepth };
}

/* Forward closure: every package a service (or package) pulls in, direct and
   transitive -- the reverse direction of blastRadius (which asks "who
   depends on me"), this asks "what do I depend on". Used for the Dependency
   Graph tab's per-service detail panel. */
function depsClosure(root){
  const seen = new Set();
  const q = [...(FWD[root]||[])];
  q.forEach(x => seen.add(x));
  let i = 0;
  while(i < q.length){
    const cur = q[i++];
    (FWD[cur]||[]).forEach(n => { if(!seen.has(n)){ seen.add(n); q.push(n); } });
  }
  return [...seen];
}

/* Rank packages by how much damage compromising them alone would cause --
   the "if I were an attacker, what's my highest-leverage target" view. */
function rankByBlastRadius(n){
  const ranked = Object.keys(PKG).map(id => ({ n:id, r: blastRadius([id]) }))
    .sort((a,b) => (b.r.appsAffected.length + b.r.pkgsAffected.length*0.1) - (a.r.appsAffected.length + a.r.pkgsAffected.length*0.1));
  return n ? ranked.slice(0, n) : ranked;
}

/* The single best immediate defensive move against a compromise of `target`:
   the candidate action that shrinks the STRUCTURAL blast radius (apps/packages
   actually still reachable) the most, not just the one with the best generic
   risk-reduction ratio. A pure version patch/pin never removes an edge from
   the dependency graph -- it neutralizes the vulnerability, but anything that
   already depends on the package still depends on it -- so ranking by risk
   score alone (as the Optimization tab does) can recommend an action that
   leaves "apps affected" completely unchanged, which reads as broken here.
   Falls back to the best risk-score action when no candidate changes reachability
   at all (e.g. the package isn't on the path to any modeled service). */

/* The package's OWN Ripple Risk Score (0-100, same scale as everywhere else
   in the app) after a specific action is applied to it -- a patch or replace
   directly changes that package's own score; an isolate action doesn't touch
   the vulnerability itself, only who can still reach it, so the score is
   correctly reported unchanged. Used instead of a portfolio-wide "% risk
   reduced" figure, which stays nearly identical across structurally similar
   packages and reads as arbitrary -- an absolute, per-package score out of
   100 actually differs by attack, the way every other score in this app does. */
function targetScoreAfter(target, action){
  if(!action) return scoreOf(target);
  if(action.type === 'patch' && action.target === target) return action.overrideScore;
  if(action.type === 'replace' && action.target === target) return action.overridePayloadScore;
  return scoreOf(target);
}
function bestContainmentFor(target){
  const pool = candidateActionsFor(target);
  if(!pool.length) return null;
  const before = blastRadius([target]);
  const baseRisk = totalRisk(cloneAdj(), {});
  const scored = pool.map(a => {
    const {adj, overrides} = evaluateAction(a, cloneAdj(), {});
    const after = blastRadius([target], adj);
    const riskAfter = totalRisk(adj, overrides);
    const reduction = Math.max(0, (baseRisk-riskAfter)/baseRisk*100);
    const containment = (before.appsAffected.length-after.appsAffected.length)*10 + (before.pkgsAffected.length-after.pkgsAffected.length);
    return Object.assign({}, a, { reduction, containment, after, adj, overrides });
  }).sort((x,y) => y.containment - x.containment || y.reduction - x.reduction);
  return { before, best: scored[0] };
}

/* The combined defense plan for a COORDINATED, multi-package compromise:
   greedily add whichever candidate action (drawn from the union of every
   compromised package's own candidate actions) shrinks the *combined* blast
   radius the most, repeating against the already-contained graph, until no
   remaining action helps. This is the multi-attack analogue of
   bestContainmentFor -- same containment-first scoring, just evaluated
   against blastRadius(seeds) instead of a single seed, and it can chain
   more than one action since a coordinated attack usually needs more than
   one firebreak. */
function bestContainmentForMulti(seeds){
  if(!seeds || !seeds.length) return null;
  const before = blastRadius(seeds);
  const seen = new Set();
  let pool = [];
  seeds.forEach(s => candidateActionsFor(s).forEach(a => { if(!seen.has(a.id)){ seen.add(a.id); pool.push(a); } }));
  if(!pool.length) return null;

  const baseRisk = totalRisk(cloneAdj(), {});
  let adj = cloneAdj(), overrides = {};
  let current = before;
  const chosen = [];
  while(pool.length){
    let bestIdx = -1, bestAfter = null, bestScore = 0, bestEval = null;
    pool.forEach((a, i) => {
      const r = evaluateAction(a, adj, overrides);
      const after = blastRadius(seeds, r.adj);
      const containment = (current.appsAffected.length-after.appsAffected.length)*10 + (current.pkgsAffected.length-after.pkgsAffected.length);
      if(containment > bestScore){ bestScore = containment; bestIdx = i; bestAfter = after; bestEval = r; }
    });
    if(bestIdx === -1) break; // nothing left meaningfully shrinks the combined blast radius
    chosen.push(pool[bestIdx]);
    adj = bestEval.adj; overrides = bestEval.overrides; current = bestAfter;
    pool.splice(bestIdx, 1);
  }
  const riskAfter = totalRisk(adj, overrides);
  const reduction = Math.max(0, (baseRisk-riskAfter)/baseRisk*100);
  return { before, after: current, chosen, reduction, adj, overrides };
}

/* ---------- format helpers ---------- */
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function pct(n){ return Math.round(n) + '%'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function matchesFilter(id){ return !state.filter || id.toLowerCase().includes(state.filter); }

/* ===================== Dependency-free force graph ===================== */
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const el = document.createElementNS(SVGNS, tag);
  if(attrs) Object.entries(attrs).forEach(([k,v]) => el.setAttribute(k, v));
  return el;
}
function radiusOf(id){
  if(isRoot(id)) return 22;
  const p = PKG[id]; if(!p) return 8;
  return 7 + Math.min(10, p.dependents*1.1);
}
function colorFor(id){
  const p = PKG[id]; if(!p) return cssVar('--muted');
  return cssVar(bucketVar(bucket(p.ripple_risk_score)));
}
/* Nodes currently visible given the active risk-tier legend + live search box.
   Root services are always shown for orientation. */
function computeDim(nodeIds){
  const active = new Set();
  nodeIds.forEach(id => {
    if(isRoot(id)){ if(matchesFilter(id) || !state.filter) active.add(id); return; }
    const p = PKG[id];
    const bucketOk = p ? state.riskFilter.has(bucket(p.ripple_risk_score)) : true;
    if(bucketOk && matchesFilter(id)) active.add(id);
  });
  return active;
}
const LAYOUT_CACHE = {};
function computeLayout(nodeIds, links, width, height){
  const key = nodeIds.slice().sort().join(',') + '|' + width + 'x' + height;
  if(LAYOUT_CACHE[key]) return LAYOUT_CACHE[key];
  const pos = {};
  const cx = width/2, cy = height/2;
  // Seed roots on an inner ring and packages on an outer ring, ordered by
  // dependent-count so heavier-hitting packages start further apart from
  // each other -- gives the relaxation a much better starting point than a
  // single shared ring, so it converges to a spread-out layout instead of
  // a dense center-weighted hairball.
  const rootIds = nodeIds.filter(isRoot);
  const pkgIds = nodeIds.filter(id=>!isRoot(id)).sort((a,b)=> (PKG[b]?PKG[b].dependents:0) - (PKG[a]?PKG[a].dependents:0));
  rootIds.forEach((id,i) => {
    const a = (i / Math.max(1,rootIds.length)) * Math.PI * 2;
    const r = Math.min(width,height)*0.16;
    pos[id] = { x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r };
  });
  pkgIds.forEach((id,i) => {
    const a = (i / Math.max(1,pkgIds.length)) * Math.PI * 2 + 0.4;
    const r = Math.min(width,height)*0.4;
    pos[id] = { x: cx + Math.cos(a)*r, y: cy + Math.sin(a)*r };
  });
  const rad = {}; nodeIds.forEach(id => rad[id] = radiusOf(id));
  const idset = new Set(nodeIds);
  const L = links.filter(l => idset.has(l.source) && idset.has(l.target));
  for(let iter=0; iter<320; iter++){
    // repulsion + hard collision separation (nodes never overlap once settled)
    for(let i=0;i<nodeIds.length;i++){
      for(let j=i+1;j<nodeIds.length;j++){
        const a=nodeIds[i], b=nodeIds[j];
        let dx = pos[a].x-pos[b].x, dy = pos[a].y-pos[b].y;
        let d2 = dx*dx+dy*dy; if(d2<1) d2=1;
        const d = Math.sqrt(d2);
        const strength = (isRoot(a)||isRoot(b)) ? 6200 : 1700;
        const f = strength / d2;
        const fx = (dx/d)*f, fy=(dy/d)*f;
        pos[a].x += fx; pos[a].y += fy; pos[b].x -= fx; pos[b].y -= fy;
        const minD = rad[a]+rad[b]+14;
        if(d < minD){
          const push = (minD-d)/2;
          const ux = dx/d, uy = dy/d;
          pos[a].x += ux*push; pos[a].y += uy*push;
          pos[b].x -= ux*push; pos[b].y -= uy*push;
        }
      }
    }
    // springs along links
    L.forEach(l => {
      const a = pos[l.source], b = pos[l.target];
      const rest = (isRoot(l.source)||isRoot(l.target)) ? 105 : 62;
      let dx=b.x-a.x, dy=b.y-a.y; let d=Math.sqrt(dx*dx+dy*dy)||1;
      const f = (d-rest) * 0.06;
      const fx=(dx/d)*f, fy=(dy/d)*f;
      a.x+=fx; a.y+=fy; b.x-=fx; b.y-=fy;
    });
    // centering
    nodeIds.forEach(id => { pos[id].x += (cx-pos[id].x)*0.006; pos[id].y += (cy-pos[id].y)*0.006; });
  }
  // clamp to bounds with margin
  const margin = 40;
  nodeIds.forEach(id => {
    pos[id].x = Math.max(margin, Math.min(width-margin, pos[id].x));
    pos[id].y = Math.max(margin, Math.min(height-margin, pos[id].y));
  });
  LAYOUT_CACHE[key] = pos;
  return pos;
}

function drawGraph(container, opts){
  opts = opts || {};
  const svg = (typeof container === 'string') ? document.getElementById(container) : container;
  const width = svg.clientWidth || 600, height = svg.clientHeight || 400;
  svg.innerHTML = '';

  const nodeIds = opts.nodes || ALL_NODES;
  const links = EDGES;
  const pos = computeLayout(nodeIds, links, width, height);
  const idset = new Set(nodeIds);
  const L = links.filter(l => idset.has(l.source) && idset.has(l.target));

  // Fit the viewBox to the actual bounding box of the laid-out nodes (plus
  // room above each for its label) instead of the raw container size, so
  // the graph fills the panel edge-to-edge no matter how the force layout
  // happens to cluster -- rather than a small knot of nodes adrift in a
  // mostly-empty canvas. Recomputed from LIVE positions (not just the
  // layout's initial output) so "Fit to screen" also does the right thing
  // after a node has been dragged somewhere the original fit didn't cover.
  function fitViewBox(){
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    nodeIds.forEach(id => {
      const r = radiusOf(id);
      const topPad = (isRoot(id) || r>12) ? 24 : 8;
      minX = Math.min(minX, pos[id].x-r); maxX = Math.max(maxX, pos[id].x+r);
      minY = Math.min(minY, pos[id].y-r-topPad); maxY = Math.max(maxY, pos[id].y+r);
    });
    const padX=24, padY=20;
    minX-=padX; maxX+=padX; minY-=padY; maxY+=padY;
    const bw = Math.max(1, maxX-minX), bh = Math.max(1, maxY-minY);
    const fitScale = Math.min(width/bw, height/bh);
    const vbW = width/fitScale, vbH = height/fitScale;
    const bcx = (minX+maxX)/2, bcy = (minY+maxY)/2;
    const vbX = bcx - vbW/2, vbY = bcy - vbH/2;
    svg.setAttribute('viewBox', `${vbX} ${vbY} ${vbW} ${vbH}`);
  }
  fitViewBox();

  const zoomG = svgEl('g', { id: 'zoomG' });
  svg.appendChild(zoomG);
  const linkG = svgEl('g'); zoomG.appendChild(linkG);
  const nodeGWrap = svgEl('g'); zoomG.appendChild(nodeGWrap);
  // Labels live in their own top layer, drawn last, so a node's name is
  // never painted over by a neighboring node's circle or pulse ring --
  // the layered z-order (links -> nodes -> labels) instead of interleaving
  // each node's own label into its own group is what keeps dense clusters legible.
  const labelG = svgEl('g', { style:'pointer-events:none' }); zoomG.appendChild(labelG);

  const highlight = opts.highlight;
  const hotColor = cssVar(opts.highlightColor || '--crit');
  const lineEls = {};
  L.forEach(l => {
    const hot = highlight && highlight.has(l.source) && highlight.has(l.target);
    const line = svgEl('line', {
      x1: pos[l.source].x, y1: pos[l.source].y, x2: pos[l.target].x, y2: pos[l.target].y,
      stroke: hot ? hotColor : cssVar('--line'),
      'stroke-width': hot ? 2 : 1.2, 'stroke-opacity': 0.8,
    });
    linkG.appendChild(line);
    (lineEls[l.source] = lineEls[l.source]||[]).push({el:line, other:l.target, end:'2'});
    (lineEls[l.target] = lineEls[l.target]||[]).push({el:line, other:l.source, end:'1'});
  });

  nodeIds.forEach(id => {
    const root = isRoot(id);
    const g = svgEl('g', { transform: `translate(${pos[id].x},${pos[id].y})`, style: 'cursor:pointer' });
    const r = radiusOf(id);
    const dim = opts.dim && !opts.dim.has(id);

    if(!root && bucket(scoreOf(id))==='crit'){
      g.appendChild(svgEl('circle', { class:'pulse', r: r+3, fill:'none', stroke: cssVar('--crit'), 'stroke-width':2 }));
    }
    const hotNode = highlight && highlight.has(id);
    const circle = svgEl('circle', {
      r, fill: root ? cssVar('--accent') : colorFor(id),
      stroke: hotNode ? hotColor : (id===state.selected ? cssVar('--ink') : 'none'),
      'stroke-width': hotNode ? 3 : (id===state.selected?2:0),
      opacity: dim ? 0.16 : 1,
    });
    g.appendChild(circle);
    if(root){
      const t = svgEl('text', { 'text-anchor':'middle', dy:'.32em', fill:'#fff', 'font-size':12, style:'pointer-events:none' });
      t.textContent = '⌘'; g.appendChild(t);
    }
    const title = svgEl('title'); title.textContent = root ? id : `${id}@${PKG[id].version}  ·  risk ${fmt1(scoreOf(id))}/100`; g.appendChild(title);

    const showLabel = root || r > 12;
    let labelEl = null;
    if(showLabel){
      labelEl = svgEl('text', {
        'text-anchor':'middle', x: pos[id].x, y: pos[id].y-(r+6),
        'font-size': root?11:9.5, 'font-weight': root?700:500, fill: cssVar('--ink-2'),
        stroke: cssVar('--bg'), 'stroke-width': 3, 'paint-order': 'stroke fill',
        opacity: dim?0.35:1,
      });
      labelEl.textContent = root ? id.replace('-service','').replace('-app','').replace('-gateway','').replace('-dashboard','') : id;
      labelG.appendChild(labelEl);
    }

    g.addEventListener('click', () => { if(opts.onClick) opts.onClick(id); });

    let dragging = false, moved = false;
    g.addEventListener('pointerdown', (ev) => { dragging = true; moved = false; g.setPointerCapture(ev.pointerId); });
    g.addEventListener('pointermove', (ev) => {
      if(!dragging) return; moved = true;
      const pt = toSvgPoint(svg, zoomG, ev.clientX, ev.clientY);
      pos[id].x = pt.x; pos[id].y = pt.y;
      g.setAttribute('transform', `translate(${pt.x},${pt.y})`);
      if(labelEl){ labelEl.setAttribute('x', pt.x); labelEl.setAttribute('y', pt.y-(r+6)); }
      (lineEls[id]||[]).forEach(({el,other,end}) => {
        el.setAttribute(end==='1'?'x1':'x2', pt.x); el.setAttribute(end==='1'?'y1':'y2', pt.y);
      });
    });
    g.addEventListener('pointerup', () => { dragging = false; });
    nodeGWrap.appendChild(g);
  });

  // simple pan + wheel zoom
  let scale=1, tx=0, ty=0, panning=false, lastX=0, lastY=0;
  function applyTransform(){ zoomG.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }
  svg.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const delta = ev.deltaY > 0 ? 0.9 : 1.1;
    scale = Math.max(0.4, Math.min(3, scale*delta));
    applyTransform();
  }, { passive:false });
  svg.addEventListener('pointerdown', (ev) => { if(ev.target===svg){ panning=true; lastX=ev.clientX; lastY=ev.clientY; } });
  svg.addEventListener('pointermove', (ev) => { if(panning){ tx += ev.clientX-lastX; ty += ev.clientY-lastY; lastX=ev.clientX; lastY=ev.clientY; applyTransform(); } });
  window.addEventListener('pointerup', () => panning=false);
  svg._resetView = () => { fitViewBox(); scale=1; tx=0; ty=0; applyTransform(); };
  svg._zoomBy = (f) => { scale = Math.max(0.4, Math.min(3, scale*f)); applyTransform(); };
}
function toSvgPoint(svg, zoomG, clientX, clientY){
  const rect = svg.getBoundingClientRect();
  const vb = svg.viewBox.baseVal;
  const scaleX = vb.width/rect.width, scaleY = vb.height/rect.height;
  const t = zoomG.getAttribute('transform')||'';
  const m = /translate\(([-.\d]+),([-.\d]+)\) scale\(([.\d]+)\)/.exec(t);
  const tx = m?parseFloat(m[1]):0, ty=m?parseFloat(m[2]):0, sc=m?parseFloat(m[3]):1;
  const rawX = vb.x + (clientX-rect.left)*scaleX, rawY = vb.y + (clientY-rect.top)*scaleY;
  return { x: (rawX-tx)/sc, y: (rawY-ty)/sc };
}

/* ---------- shared graph chrome: clickable legend + zoom controls ---------- */
function legendHTML(showService){
  const rows = ['crit','high','med','low'].map(b =>
    `<div class="legend-row ${state.riskFilter.has(b)?'':'off'}" data-bucket="${b}"><span class="legend-dot" style="background:var(--${b})"></span>${bucketLabel(b)}</div>`
  ).join('');
  const service = showService ? `<div class="legend-row" style="cursor:default;"><span class="legend-dot" style="background:var(--accent)"></span>Service</div>` : '';
  return `<div class="legend">${rows}${service}</div>`;
}
function zoomCtlHTML(prefix){
  return `<div class="zoom-ctl">
    <button class="zoom-btn" id="${prefix}-zin" title="Zoom in">+</button>
    <button class="zoom-btn" id="${prefix}-zout" title="Zoom out">&minus;</button>
    <button class="zoom-btn" id="${prefix}-zreset" title="Reset view">&#8863;</button>
  </div>`;
}
function wireGraphChrome(el, prefix, svgId){
  el.querySelectorAll(`.legend-row[data-bucket]`).forEach(row => {
    row.onclick = () => {
      const b = row.dataset.bucket;
      if(state.riskFilter.has(b)){ if(state.riskFilter.size>1) state.riskFilter.delete(b); }
      else state.riskFilter.add(b);
      render();
    };
  });
  const svg = document.getElementById(svgId);
  const zin = document.getElementById(prefix+'-zin'), zout = document.getElementById(prefix+'-zout'), zreset = document.getElementById(prefix+'-zreset');
  if(zin) zin.onclick = () => svg._zoomBy && svg._zoomBy(1.25);
  if(zout) zout.onclick = () => svg._zoomBy && svg._zoomBy(0.8);
  if(zreset) zreset.onclick = () => svg._resetView && svg._resetView();
}

/* ---------- Live vulnerability monitoring ----------
   This is the one part of FaultLine that is NOT a simulation over a fixed
   snapshot: it queries the real, public OSV.dev vulnerability database, live,
   from the browser, against the actual package names + pinned versions in
   this dependency tree. It's best-effort by nature -- a browser can only
   reach OSV.dev if the network in front of it allows the cross-origin
   request -- so every failure path renders an honest "unavailable" state
   rather than ever fabricating a result. */
const OSV_BATCH_URL = 'https://api.osv.dev/v1/querybatch';
const OSV_VULN_URL = id => `https://api.osv.dev/v1/vulns/${encodeURIComponent(id)}`;

// fetch() with a hard timeout -- without this, a stalled connection (a captive
// portal, a proxy that accepts the socket but never answers) hangs forever
// and looks identical to "still checking" instead of surfacing as an error.
async function fetchWithTimeout(url, opts, ms = 15000){
  // Deliberately NOT using AbortController/signal here: passing an AbortSignal
  // into fetch() trips a real bug in some browser extensions that intercept
  // fetch and try to relay the request across a postMessage boundary --
  // AbortSignal isn't structured-cloneable, so the extension throws
  // "Failed to execute 'postMessage' on 'Window': AbortSignal object could
  // not be cloned", which looks like an OSV.dev failure but has nothing to do
  // with the network. A plain Promise.race gives the same timeout behavior
  // without ever constructing an AbortSignal.
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => {
      const e = new Error('OSV.dev did not respond within 15s.');
      e.name = 'TimeoutError';
      reject(e);
    }, ms);
  });
  try{
    return await Promise.race([fetch(url, opts), timeout]);
  } finally {
    clearTimeout(timer);
  }
}

// Turn a thrown fetch error into a message that actually says what happened,
// instead of a single generic "can't reach it" string no matter the cause --
// a 4xx from OSV, a timeout, and a real network/CORS failure all look very
// different in the browser console and should look different here too.
function describeLiveFetchError(err){
  // Matched by message text, not `instanceof TypeError` -- a browser extension
  // that wraps/relays fetch (as one clearly does in this environment, per the
  // earlier AbortSignal/postMessage failure) can re-throw a plain Error that
  // carries the original message but loses the native TypeError prototype, so
  // an instanceof check silently falls through to the generic branch below.
  const msg = (err && err.message) || '';
  if(err && err.name === 'TimeoutError') return 'Timed out waiting for OSV.dev to respond (15s) -- the free API can be slow under load. Try again.';
  if(/postMessage|could not be cloned/i.test(msg)) return 'A browser extension on this page interfered with the request (not an OSV.dev or network problem). Try again in a private/incognito window with extensions disabled.';
  if(/failed to fetch|networkerror|network error|load failed|net::|dns|refused|cors|blocked/i.test(msg)) return `Could not reach OSV.dev from this browser (${msg}). This usually means you're offline, a firewall/VPN/corporate proxy is blocking api.osv.dev, or a browser extension is intercepting the request -- try a private/incognito window with extensions disabled, or a different network, then retry.`;
  return `OSV.dev check failed: ${msg || 'unknown error'}.`;
}

async function runLiveScan(){
  if(state.live.status === 'checking') return;
  state.live.status = 'checking';
  state.live.error = null;
  render();

  const names = Object.keys(PKG);
  try{
    const queries = names.map(n => ({ package: { name: n, ecosystem: 'npm' }, version: PKG[n].version }));
    const res = await fetchWithTimeout(OSV_BATCH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ queries }),
    });
    if(!res.ok){
      let detail = '';
      try{ detail = (await res.text()).slice(0, 200); }catch(e){}
      throw new Error(`OSV.dev returned HTTP ${res.status}${detail ? ' -- ' + detail : ''}`);
    }
    const data = await res.json();
    const results = data.results || [];

    const findings = {};
    const toFetch = [];
    results.forEach((r, i) => {
      const vulns = (r && r.vulns) || [];
      if(!vulns.length) return;
      findings[names[i]] = vulns.map(v => ({ id: v.id }));
      vulns.slice(0, 2).forEach(v => toFetch.push({ pkg: names[i], id: v.id }));
    });

    // Enrich a bounded number of hits with human-readable details. A batch hit
    // with no detail fetched yet still renders (just with its raw ID), so a
    // slow detail call never hides a real finding.
    const details = await Promise.all(toFetch.slice(0, 20).map(async item => {
      try{
        const r = await fetchWithTimeout(OSV_VULN_URL(item.id));
        if(!r.ok) return null;
        const v = await r.json();
        const cve = (v.aliases || []).find(a => /^CVE-/.test(a)) || null;
        return { pkg: item.pkg, id: item.id, cve, summary: v.summary || '', published: v.published || null, fixedVersion: liveFixedVersionFrom(v, item.pkg) };
      }catch(e){ return null; }
    }));
    details.filter(Boolean).forEach(d => {
      findings[d.pkg] = findings[d.pkg] || [];
      const idx = findings[d.pkg].findIndex(f => f.id === d.id);
      if(idx >= 0) findings[d.pkg][idx] = d; else findings[d.pkg].push(d);
    });

    state.live.findings = findings;
    state.live.status = 'done';
    state.live.lastChecked = new Date();
  }catch(err){
    state.live.status = 'error';
    state.live.error = describeLiveFetchError(err);
  }
  render();
}

// Pull the real "fixed in" version out of an OSV vuln record, if it published
// one for this package's npm range -- lets a live finding recommend an exact
// upgrade instead of a generic "go patch it".
function liveFixedVersionFrom(osvVuln, pkgName){
  const aff = (osvVuln.affected || []).find(a => a.package && a.package.ecosystem === 'npm' && a.package.name === pkgName);
  if(!aff) return null;
  for(const r of (aff.ranges || [])){
    for(const e of (r.events || [])){
      if(e.fixed) return e.fixed;
    }
  }
  return null;
}

function liveStatusInfo(){
  const L = state.live;
  const findingCount = Object.values(L.findings).reduce((a, v) => a + v.length, 0);
  const pkgCount = Object.keys(L.findings).length;
  let statusHTML, dotClass;
  if(L.status === 'idle'){
    statusHTML = `<span class="live-status-text">Not checked yet this session.</span>`;
    dotClass = 'live-dot-idle';
  } else if(L.status === 'checking'){
    statusHTML = `<span class="live-status-text">Querying OSV.dev for all ${Object.keys(PKG).length} packages…</span>`;
    dotClass = 'live-dot-checking';
  } else if(L.status === 'error'){
    statusHTML = `<span class="live-status-text live-status-error">${escapeHtml(L.error)}</span>`;
    dotClass = 'live-dot-error';
  } else {
    statusHTML = findingCount
      ? `<span class="live-status-text live-status-alert">${findingCount} live advisor${findingCount>1?'ies':'y'} found, across ${pkgCount} package${pkgCount>1?'s':''}.</span>`
      : `<span class="live-status-text live-status-ok">No live advisories found for the versions currently pinned.</span>`;
    dotClass = findingCount ? 'live-dot-alert' : 'live-dot-ok';
  }
  return { findingCount, pkgCount, statusHTML, dotClass };
}

// Real fix (from OSV's own "fixed" event) beats a generic optimizer action;
// falling back to the existing containment optimizer means every live hit
// still gets a concrete, structurally-evaluated recommendation even when
// OSV didn't publish an exact fixed version.
function liveRecommendationFor(pkgId){
  // Route through the same engine Defender Strategy uses (bestContainmentFor ->
  // candidateActionsFor, which already prefers the real OSV "fixed in" version
  // when one is known) so the Live Threat Feed and Defender Strategy never
  // disagree about which action is recommended for the same package.
  const def = bestContainmentFor(pkgId);
  if(!def || !def.best) return null;
  const best = def.best;
  const finds = state.live.findings[pkgId] || [];
  const withFix = finds.find(f => f.fixedVersion);
  const isRealFix = best.type === 'patch' && !!withFix;
  const scoreBefore = scoreOf(pkgId), scoreAfter = targetScoreAfter(pkgId, best);
  const meta = isRealFix
    ? `Fixes ${withFix.id}${withFix.cve ? ' / ' + withFix.cve : ''} — real fix version from OSV.dev &middot; ${fmt1(scoreBefore)} &rarr; ${fmt1(scoreAfter)} risk /100`
    : `${fmt1(scoreBefore)} &rarr; ${fmt1(scoreAfter)} risk /100 &middot; ${best.time} &middot; ${best.effort} effort (FaultLine optimizer)`;
  return { real: isRealFix, label: best.label, meta };
}

/* ---------- Upload Project: scan a visitor's own manifest against OSV.dev ----------
   This deliberately stays separate from the embedded PKG/FWD/REV demo graph --
   an uploaded project doesn't have real maintainer/download/behavioral-trust
   history for us to show, and fabricating a Ripple Risk Score for it would be
   exactly the kind of "random metric" this dashboard is built to call out in
   other tools. So this feature tells the truth about what it actually knows:
   real package names + versions parsed straight from the uploaded manifest,
   checked live against the real OSV.dev database, with real "fixed in"
   versions where OSV publishes one -- nothing invented. */
const UPLOAD_MAX_PACKAGES = 60;

function parseManifestText(text, fileName){
  let json;
  try{ json = JSON.parse(text); }
  catch(e){ throw new Error('That file isn\'t valid JSON. Upload a package.json or package-lock.json.'); }

  const out = new Map(); // name -> version (first one wins)
  const add = (name, version) => {
    if(!name || out.has(name)) return;
    out.set(name, version || 'unknown');
  };

  if(json.packages && typeof json.packages === 'object'){
    // npm lockfile v2/v3
    Object.entries(json.packages).forEach(([key, val]) => {
      if(!key) return; // "" is the root project itself
      const idx = key.lastIndexOf('node_modules/');
      const name = idx === -1 ? null : key.slice(idx + 'node_modules/'.length);
      if(name && val && val.version) add(name, val.version);
    });
    return { packages: [...out.entries()].map(([name, version]) => ({name, version})), source: 'lock' };
  }
  if(json.dependencies && typeof json.dependencies === 'object' && Object.values(json.dependencies).some(v => v && typeof v === 'object' && v.version)){
    // npm lockfile v1
    const walk = (deps) => Object.entries(deps || {}).forEach(([name, val]) => {
      if(val && val.version) add(name, val.version);
      if(val && val.dependencies) walk(val.dependencies);
    });
    walk(json.dependencies);
    return { packages: [...out.entries()].map(([name, version]) => ({name, version})), source: 'lock' };
  }
  if(json.dependencies || json.devDependencies){
    // plain package.json -- direct deps only, version ranges stripped to a concrete-ish version
    Object.entries({ ...(json.dependencies||{}), ...(json.devDependencies||{}) }).forEach(([name, spec]) => {
      const stripped = String(spec).replace(/^[^\d]*/, '').trim();
      add(name, /^\d/.test(stripped) ? stripped : null);
    });
    return { packages: [...out.entries()].map(([name, version]) => ({name, version: version||'latest'})), source: 'manifest' };
  }
  throw new Error('Couldn\'t find any dependencies in that file. Upload a package.json or package-lock.json.');
}

function handleUploadFile(file){
  const U = state.upload;
  U.status = 'reading'; U.error = null; U.fileName = file.name; render();
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const { packages, source } = parseManifestText(String(reader.result), file.name);
      if(!packages.length) throw new Error('That file has no dependencies to scan.');
      U.packages = packages;
      U.source = source;
      U.findings = {};
      U.status = 'idle';
      render();
      runUploadScan();
    }catch(err){
      U.status = 'error';
      U.error = err.message || 'Could not read that file.';
      render();
    }
  };
  reader.onerror = () => { U.status = 'error'; U.error = 'Could not read that file.'; render(); };
  reader.readAsText(file);
}

async function runUploadScan(){
  const U = state.upload;
  if(U.status === 'checking' || !U.packages.length) return;
  U.status = 'checking'; U.error = null; render();

  const scanList = U.packages.slice(0, UPLOAD_MAX_PACKAGES);
  try{
    const queries = scanList.map(p => ({ package: { name: p.name, ecosystem: 'npm' }, version: p.version === 'unknown' || p.version === 'latest' ? undefined : p.version }));
    const res = await fetchWithTimeout(OSV_BATCH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ queries }),
    });
    if(!res.ok){
      let detail = '';
      try{ detail = (await res.text()).slice(0, 200); }catch(e){}
      throw new Error(`OSV.dev returned HTTP ${res.status}${detail ? ' -- ' + detail : ''}`);
    }
    const data = await res.json();
    const results = data.results || [];

    const findings = {};
    const toFetch = [];
    results.forEach((r, i) => {
      const vulns = (r && r.vulns) || [];
      if(!vulns.length) return;
      findings[scanList[i].name] = vulns.map(v => ({ id: v.id }));
      vulns.slice(0, 2).forEach(v => toFetch.push({ pkg: scanList[i].name, id: v.id }));
    });

    const details = await Promise.all(toFetch.slice(0, 25).map(async item => {
      try{
        const r = await fetchWithTimeout(OSV_VULN_URL(item.id));
        if(!r.ok) return null;
        const v = await r.json();
        const cve = (v.aliases || []).find(a => /^CVE-/.test(a)) || null;
        return { pkg: item.pkg, id: item.id, cve, summary: v.summary || '', published: v.published || null, fixedVersion: liveFixedVersionFrom(v, item.pkg) };
      }catch(e){ return null; }
    }));
    details.filter(Boolean).forEach(d => {
      findings[d.pkg] = findings[d.pkg] || [];
      const idx = findings[d.pkg].findIndex(f => f.id === d.id);
      if(idx >= 0) findings[d.pkg][idx] = d; else findings[d.pkg].push(d);
    });

    U.findings = findings;
    U.status = 'done';
  }catch(err){
    U.status = 'error';
    U.error = describeLiveFetchError(err);
  }
  render();
}

/* Live counterfactual preview computations -- a real structural mutation +
   recompute against the SAME engine the Optimization tab uses, pointed at
   whichever package/service the picker currently selects. */
function previewCounterfactual(type, target){
  const base = totalRisk(cloneAdj(), {});
  let adj = cloneAdj(); let overrides = {};
  let tempNode = null;
  const highlight = new Set([target]);
  if(type==='add'){
    tempNode = 'hypothetical-pkg';
    PKG[tempNode] = { ripple_risk_score: 50, dependents: 0, apps_affected: [target], criticality:2, exposure:5, propagation_depth:0, unknown_risk_score:50, maintainers:3, last_release_days:30, downloads_m:1, version:'0.1.0', license:'MIT' };
    adj = applyMutation(adj, {type:'add', root:target, payload:tempNode});
  }
  if(type==='remove'){
    adj = applyMutation(adj, {type:'remove', target});
    (REV[target]||[]).forEach(n=>highlight.add(n));
  }
  if(type==='replace'){
    const payload = target+'-safe-fork';
    adj = applyMutation(adj, {type:'replace', target, payload});
    overrides[payload] = 20;
    (REV[target]||[]).forEach(n=>highlight.add(n));
  }
  if(type==='isolate'){
    adj = applyMutation(adj, {type:'isolate', target});
    (FWD[target]||[]).forEach(n=>highlight.add(n));
  }
  const after = totalRisk(adj, overrides);
  if(tempNode) delete PKG[tempNode]; // scratch node only -- never persisted
  return { before: base, after, delta: after-base, highlight };
}

/* ===================== recommendations / optimizer engine ===================== */
/* Candidate interventions are generated FOR a specific scenario package --
   using that package's own real data (does it carry the actual CVE? which
   real services does it reach per apps_affected?) -- so different scenarios
   genuinely produce different options and different numbers, not a fixed
   6-item list recycled for everything. */
function patchedScore(target){
  const s = scoreOf(target);
  const hasCVE = target === FEATURED;
  // Patching resolves the CVE-severity term entirely (the largest weighted
  // factor in the score); pinning a non-CVE package mainly resolves the
  // maintenance/behavioral-trust term, a smaller share of the composite --
  // so a real CVE fix cuts further than a routine pin-to-latest.
  return Math.round((hasCVE ? s*0.35 : s*0.55) * 10) / 10;
}
function candidateActionsFor(target){
  const p = PKG[target];
  if(!p) return [];
  const hasCVE = target === FEATURED;
  // Once a live OSV.dev check has found a real "fixed in" version for this
  // package, the patch action names that exact version everywhere it's
  // recommended (Defender Strategy, Optimization, the Live Threat Feed) --
  // one real fix, one consistent label, instead of each screen independently
  // guessing at generic phrasing.
  const liveFix = (state.live.findings[target] || []).find(f => f.fixedVersion);
  const actions = [];
  actions.push({
    id: `patch-${target}`,
    label: liveFix ? `Update ${target} to ${liveFix.fixedVersion}` : (hasCVE ? `Patch ${target} to ${DATA.advisory.fixed_version}` : `Pin ${target} to latest maintained release`),
    type: 'patch', target, overrideScore: patchedScore(target),
    time: (hasCVE || liveFix) ? '1 day' : '< 1 day', effort: 'Low', effortW: 1,
  });
  if(target === 'lodash'){
    actions.push({ id:'replace-lodash', label:'Replace lodash with lodash-es', type:'replace', target:'lodash', payload:'lodash-es', overridePayloadScore: 22, time:'2-3 days', effort:'Medium', effortW:2 });
  }
  (p.apps_affected||[]).forEach(app => {
    actions.push({
      id: `isolate-${app}-${target}`,
      label: `Isolate ${app} from ${target} chain`,
      type: 'isolate', target: app,
      time: '1-2 days', effort: 'Medium', effortW: 2,
    });
  });
  return actions;
}
function evaluateAction(a, baseAdj, baseOverrides){
  let adj = { FWD: JSON.parse(JSON.stringify(baseAdj.FWD)), REV: JSON.parse(JSON.stringify(baseAdj.REV)) };
  let overrides = Object.assign({}, baseOverrides);
  if(a.type==='patch'){ overrides[a.target] = a.overrideScore; }
  if(a.type==='replace'){ adj = applyMutation(adj, {type:'replace', target:a.target, payload:a.payload}); overrides[a.payload] = a.overridePayloadScore; }
  if(a.type==='isolate'){ adj = applyMutation(adj, {type:'isolate', target:a.target}); }
  return { adj, overrides };
}
function topRecommendationsFor(target, n){
  const base = totalRisk(cloneAdj(), {});
  const scored = candidateActionsFor(target).map(a => {
    const {adj, overrides} = evaluateAction(a, cloneAdj(), {});
    const after = totalRisk(adj, overrides);
    const reduction = Math.max(0, (base-after)/base*100);
    return Object.assign({}, a, { reduction, ratio: reduction/a.effortW });
  }).sort((x,y)=>y.ratio-x.ratio);
  return scored.slice(0,n);
}
function minimumInterventionSet(target, targetDropPct){
  let adj = cloneAdj(); let overrides = {}; const chosen = [];
  let base = totalRisk(adj, overrides);
  const dropTarget = base * (1 - targetDropPct);
  const pool = candidateActionsFor(target).slice();
  let current = base;
  while(current > dropTarget && pool.length){
    let bestIdx=-1, bestAfter=current, bestA=null;
    pool.forEach((a,i)=>{
      const r = evaluateAction(a, adj, overrides);
      const after = totalRisk(r.adj, r.overrides);
      if(after < bestAfter){ bestAfter=after; bestIdx=i; bestA=r; }
    });
    if(bestIdx===-1) break;
    chosen.push(pool[bestIdx]);
    adj = bestA.adj; overrides = bestA.overrides; current = bestAfter;
    pool.splice(bestIdx,1);
  }
  return { chosen, before: base, after: current, target: dropTarget };
}

  } else if(state.simMode==='defender'){
    const candidates = Object.entries(PKG).sort((a,b)=>b[1].ripple_risk_score-a[1].ripple_risk_score).slice(0,6).map(([n])=>n);
    const pickerHTML = `
      <div style="font-size:12.5px; font-weight:600; color:var(--ink-2); margin-bottom:8px;">Compromised package(s) &mdash; check more than one to defend a coordinated attack:</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;">
        ${candidates.map(n=>`<label style="display:flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; cursor:pointer;">

    } else if(def.multi){
      const { before, after, chosen, seeds } = def;
      const spreadChanged = before.appsAffected.length !== after.appsAffected.length || before.pkgsAffected.length !== after.pkgsAffected.length;
      const seedScores = seeds.map(s => ({ s, before: scoreOf(s), after: targetScoreAfter(s, chosen.find(a=>a.target===s)) }));
      const worst = seedScores.reduce((a,b)=> b.before>a.before?b:a, seedScores[0]);
      bodyHTML = `<div style="font-size:12.5px; color:var(--ink-2);">Coordinated attack on <b>${seeds.join(', ')}</b> &middot; combined firebreak: <b>${chosen.length}</b> action${chosen.length!==1?'s':''}</div>
        <div class="metric-row" style="margin-top:10px;">
          <div class="metric-box"><div class="mv">${before.appsAffected.length} &rarr; ${after.appsAffected.length}</div><div class="ml">apps affected</div></div>
          <div class="metric-box"><div class="mv">${before.pkgsAffected.length} &rarr; ${after.pkgsAffected.length}</div><div class="ml">packages affected</div></div>
          <div class="metric-box"><div class="mv" style="color:${worst.after<worst.before?'var(--low)':'var(--ink)'}">${fmt1(worst.before)} &rarr; ${fmt1(worst.after)}</div><div class="ml">${escapeHtml(worst.s)} risk /100</div></div>
        </div>
        ${chosen.length ? `<div style="margin-top:12px;">${chosen.map(a=>`
          <div class="action-row">
            <div class="action-check done">${icon('check',13)}</div>
            <div class="action-body"><div class="action-title">${a.label}</div></div>
          </div>`).join('')}</div>` : `<div class="empty-hint">No candidate action reduces the combined blast radius.</div>`}
        ${spreadChanged ? '' : `<div class="meta-line">These actions neutralize the vulnerabilities themselves but don't remove any service's structural dependency on them &mdash; see Optimization for a deeper containment plan.</div>`}`;
    } else {
      const { before, best, seed } = def;
      const spreadChanged = before.appsAffected.length !== best.after.appsAffected.length || before.pkgsAffected.length !== best.after.pkgsAffected.length;
      const scoreBefore = scoreOf(seed), scoreAfter = targetScoreAfter(seed, best);
      bodyHTML = `<div style="font-size:12.5px; color:var(--ink-2);">Attack on <b>${seed}</b> &middot; best immediate defense: <b>${best.label}</b></div>
        <div class="metric-row" style="margin-top:10px;">
          <div class="metric-box"><div class="mv">${before.appsAffected.length} &rarr; ${best.after.appsAffected.length}</div><div class="ml">apps affected</div></div>
          <div class="metric-box"><div class="mv">${before.pkgsAffected.length} &rarr; ${best.after.pkgsAffected.length}</div><div class="ml">packages affected</div></div>
          <div class="metric-box"><div class="mv" style="color:${scoreAfter<scoreBefore?'var(--low)':'var(--ink)'}">${fmt1(scoreBefore)} &rarr; ${fmt1(scoreAfter)}</div><div class="ml">${escapeHtml(seed)} risk /100</div></div>
        </div>
        ${spreadChanged ? '' : `<div class="meta-line">This neutralizes the vulnerability in <b>${seed}</b> itself but doesn't remove any service's structural dependency on it &mdash; see Optimization for a full containment plan.</div>`}`;
    }

    container.innerHTML = pickerHTML + bodyHTML;
    container.querySelectorAll('.def-seed-cb').forEach(cb => cb.onchange = () => {
      const checked = [...container.querySelectorAll('.def-seed-cb:checked')].map(c=>c.value);
      state.simSeeds = checked.length ? checked : [FEATURED];
      state.simLevel = -1;
      selectPkg(state.simSeeds[0]);
      renderSimControls();
      renderSimGraphAndResults();
    });
  }
}

/* The defense currently in effect for the Sim tab -- only meaningful in
   Defender Strategy mode. Shared by the controls panel and the propagation
   graph/results/timeline below so the whole tab tells one consistent story
   instead of the graph showing the raw (undefended) spread next to numbers
   that claim it was contained. */
function currentDefense(){
  if(state.simMode !== 'defender') return null;
  const seeds = state.simSeeds.length ? state.simSeeds : [FEATURED];
  if(seeds.length > 1){
    const res = bestContainmentForMulti(seeds);
    return res ? Object.assign({ seeds, multi: true }, res) : null;
  }
  const seed = seeds[0];
  const res = bestContainmentFor(seed);
  return res ? Object.assign({ seed, seeds, multi: false }, res) : null;
}
function currentSimAdj(){
  const def = currentDefense();
  if(!def) return { FWD, REV };
  return def.multi ? def.adj : def.best.adj;
}

function renderSimGraphAndResults(){
  const adj = currentSimAdj();
  const r = blastRadius(state.simSeeds, adj);
  const highlightSet = new Set(state.simLevel<0 ? r.affected.concat(state.simSeeds) : [...state.simSeeds, ...r.affected.filter(n=>r.levels[n]<=state.simLevel)]);
  drawGraph('sim-graph', { highlight: highlightSet, onClick:id=>{ state.selected=id; } });
  document.getElementById('sim-results').innerHTML = `
    <div class="metric-row">
      <div class="metric-box"><div class="mv">${r.appsAffected.length}</div><div class="ml">services / apps</div></div>
      <div class="metric-box"><div class="mv">${r.pkgsAffected.length}</div><div class="ml">packages</div></div>
      <div class="metric-box"><div class="mv">${r.maxDepth}</div><div class="ml">propagation depth</div></div>
    </div>
    <div id="sim-timeline"></div>
  `;
  renderTimeline(adj);
}
function renderTimeline(adj){
  const r = blastRadius(state.simSeeds, adj);
  const maxL = r.maxDepth;
  const rows = [`<div class="action-row"><div class="action-check done">${icon('check',13)}</div><div class="action-body"><div class="action-title">T+0 &middot; Compromised</div><div class="action-meta">${state.simSeeds.join(', ')}</div></div></div>`];
  for(let l=1; l<=maxL; l++){
    const atLevel = r.affected.filter(n=>r.levels[n]===l);
    if(!atLevel.length) continue;
    rows.push(`<div class="action-row" style="opacity:${state.simLevel<0||state.simLevel>=l?1:0.35}">
      <div class="action-check ${state.simLevel<0||state.simLevel>=l?'done':''}">${icon('check',13)}</div>
      <div class="action-body"><div class="action-title">T+${l}</div><div class="action-meta">${atLevel.join(', ')}</div></div>
    </div>`);
  }
  document.getElementById('sim-timeline').innerHTML = rows.join('');
}
let simTimer = null;
function startSimAnimation(){
  state.tab='sim'; render();
  const r = blastRadius(state.simSeeds, currentSimAdj());
  clearInterval(simTimer); state.simLevel = -1;
  simTimer = setInterval(()=>{
    state.simLevel++;
    if(state.simLevel > r.maxDepth){ clearInterval(simTimer); return; }
    renderSimGraphAndResults();
  }, 700);
}

/* ===================== OPTIMIZATION TAB ===================== */
function sortScored(list){
  const {key,dir} = state.optSort;
  const mul = dir==='asc' ? 1 : -1;
  return list.slice().sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(typeof av==='string') return av.localeCompare(bv)*mul;
    return (av-bv)*mul;
  });
}
function renderOptTab(el){
  const target = PKG[state.optScenario] ? state.optScenario : FEATURED;
  const targetP = PKG[target];
  const base = totalRisk(cloneAdj(), {});
  const pool = candidateActionsFor(target);
  const scored = pool.map(a => {
    const {adj, overrides} = evaluateAction(a, cloneAdj(), {});
    const after = totalRisk(adj, overrides);
    const reduction = Math.max(0, (base-after)/base*100);
    return Object.assign({}, a, { reduction, ratio: reduction/a.effortW, after });
  }).sort((x,y)=>y.ratio-x.ratio);
  const recommended = scored[0];
  const tableRows = sortScored(scored);
  const cols = [ {k:'label', t:'Action'}, {k:'reduction', t:'Reduction'}, {k:'effortW', t:'Effort'}, {k:'ratio', t:'Priority'} ];
  const scenarioOptions = Object.keys(PKG).sort((a,b)=>scoreOf(b)-scoreOf(a));

        </div>
      </div>
      ${pool.length ? `<div id="firebreak-list"></div>` : `<div class="empty-hint">No services depend on ${target}, so no intervention changes the portfolio's risk.</div>`}
    </div>

    <div class="grid2b">
      <div class="card">
        <div class="card-head"><h3>Minimum Intervention Set</h3></div>
        <div class="slider-row">
          <input type="range" id="mis-slider" min="10" max="70" step="5" value="${Math.round(state.misTarget*100)}" />

        </div>
        <div id="mis-result"></div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Risk-Reduction / Effort Ranking</h3></div>
        ${tableRows.length ? `<div class="table-wrap"><table><thead><tr>
          ${cols.map(c=>`<th class="sortable" data-sort="${c.k}">${c.t}${state.optSort.key===c.k?`<span class="arrow">${state.optSort.dir==='asc'?'&uarr;':'&darr;'}</span>`:''}</th>`).join('')}
        </tr></thead><tbody>
          ${tableRows.map(a=>`<tr><td>${a.label}</td><td class="num">${pct(a.reduction)}</td><td>${a.effort}</td><td>${a.ratio>10?`<span class="pill pill-low">Very High</span>`:a.ratio>5?`<span class="pill pill-med">Medium</span>`:`<span class="pill" style="background:var(--surface-2); color:var(--muted);">Low</span>`}</td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-hint">No interventions modeled for this package.</div>`}
      </div>
    </div>
  `;

  document.getElementById('opt-scenario-select').onchange = (e) => { state.optScenario = e.target.value; renderOptTab(el); };

  if(pool.length){
    document.getElementById('firebreak-list').innerHTML = scored.slice(0,3).map((a,i)=>`
      <div class="action-row ${a.id===recommended.id?'action-row-rec':''}">
        <div class="rank">${String.fromCharCode(65+i)}</div>

          <div class="action-title">${a.label}</div>
          <div class="action-meta">${a.time} &middot; ${a.effort} effort</div>
        </div>
        <div class="fb-delta">
          ${a.id===recommended.id?'<span class="badge-rec">Recommended</span>':''}

  }

  el.querySelectorAll('th.sortable').forEach(th => {
    th.onclick = () => {
      const key = th.dataset.sort;
      if(state.optSort.key===key) state.optSort.dir = state.optSort.dir==='asc'?'desc':'asc';
      else state.optSort = { key, dir: key==='label'?'asc':'desc' };
      renderOptTab(el);
    };
  });

  function renderMis(pct100){
    state.misTarget = pct100/100;
    const res = minimumInterventionSet(target, state.misTarget);
    const met = res.after <= res.target + 0.05;
    document.getElementById('mis-result').innerHTML = res.chosen.length===0 && !pool.length ? `

}

        </div>
      </div>
      <div class="card">
        <div class="card-head"><h3>Historical Backtesting</h3></div>
        <div id="incidents"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3>Methodology &amp; Data Notes</h3></div>
      <div class="info-note">${DATA.methodology_note}</div>
    </div>
  `;
  document.getElementById('incidents').innerHTML = DATA.incidents.map(inc => `
    <div class="action-row">
      <div class="crit-icon" style="width:30px;height:30px;background:var(--med-soft); color:var(--med);">${icon('alert',15)}</div>
      <div class="action-body">
        <div class="action-title">${inc.name} <span style="font-weight:500; color:var(--muted);">&middot; ${inc.date}</span></div>
        <div class="action-meta">${inc.description}</div>
        <div style="margin-top:5px;">${inc.pattern.map(p=>`<span class="pill pill-accent" style="margin:2px 4px 2px 0;">${p}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

/* ===================== render dispatcher / init ===================== */
function render(){
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.tab===state.tab));
  const el = document.getElementById('content');
  if(state.tab==='overview') renderOverview(el);
  else if(state.tab==='live') renderLiveTab(el);
  else if(state.tab==='cf') renderCfTab(el);
  else if(state.tab==='graph') renderGraphTab(el);
  else if(state.tab==='sim') renderSimTab(el);
  else if(state.tab==='opt') renderOptTab(el);
  else if(state.tab==='upload') renderUploadTab(el);
  else if(state.tab==='reports') renderReportsTab(el);
}

document.getElementById('nav').addEventListener('click', (e) => {
  const b = e.target.closest('.nav-item'); if(!b) return;
  clearInterval(simTimer);
  state.tab = b.dataset.tab; render();
});
document.getElementById('runSimBtn').onclick = () => { selectPkg(FEATURED); state.simSeeds=[FEATURED]; state.simMode='single'; startSimAnimation(); };
document.getElementById('themeToggle').onclick = () => {
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const next = cur==='dark' ? 'light' : (cur==='light' ? null : 'dark');
  if(next) root.setAttribute('data-theme', next); else root.removeAttribute('data-theme');
  render();
};
document.getElementById('searchBox').addEventListener('input', (e) => {
  state.filter = e.target.value.toLowerCase();
  if(state.tab==='overview' || state.tab==='graph') render();
});
document.getElementById('searchBox').addEventListener('keydown', (e) => {
  if(e.key==='Enter' && state.filter){
    const match = Object.keys(PKG).find(n=>n.toLowerCase().includes(state.filter));
    if(match){ state.selected = match; state.tab='graph'; render(); }
  }
});

render();
// Best-effort live check, fired once on load. If the browser can't reach
// OSV.dev (offline, blocked network), this simply settles into the
// "unavailable" state rendered by renderLiveMonitor -- it never fakes data.
runLiveScan();

</script>
</body>
</html>
